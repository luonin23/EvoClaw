<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoClaw v2.0</title>
<link href="https://fonts.loli.net/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --elev:#141414; --surface:#1a1a1a; --hover:#242424;
  --accent:#00d084; --error:#ff4757; --warn:#f59e0b;
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.14);
  --t1:#f5f5f5; --t2:#a1a1aa; --t3:#71717a;
  --mono:'JetBrains Mono','SF Mono',monospace;
  --ui:'Inter',-apple-system,'PingFang SC','Segoe UI',sans-serif;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ui);background:var(--bg);color:var(--t1);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse 70% 45% at 12% 0%,rgba(0,208,132,.05),transparent 60%),
  radial-gradient(ellipse 55% 40% at 92% 100%,rgba(0,208,132,.035),transparent 60%)}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}

/* header */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#00b86b);color:#04120c;font-weight:800;font-size:14px}
.ver{font-family:var(--mono);font-size:10px;color:var(--t3);border:1px solid var(--bd);padding:2px 7px;border-radius:20px}
.badges{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--t2)}
.badge.ok{border-color:rgba(0,208,132,.35);color:var(--accent);background:rgba(0,208,132,.08)}
.badge.warn{border-color:rgba(245,158,11,.35);color:var(--warn);background:rgba(245,158,11,.08)}
.badge.err{border-color:rgba(255,71,87,.35);color:var(--error);background:rgba(255,71,87,.08)}
.btn{font-family:var(--ui);font-size:12px;font-weight:500;padding:7px 14px;border-radius:8px;
  border:1px solid var(--bd2);background:var(--surface);color:var(--t1);cursor:pointer;transition:.15s}
.btn:hover{border-color:rgba(0,208,132,.4);color:var(--accent)}
.btn.primary{background:var(--accent);color:#04120c;border-color:transparent;font-weight:600}
.btn.danger{border-color:rgba(255,71,87,.4);color:var(--error)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* cards */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--elev);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.card .lbl{font-size:11px;color:var(--t3);margin-bottom:6px}
.card .val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;word-break:break-all}
.card .sub{font-size:11px;color:var(--t3);margin-top:4px;font-family:var(--mono)}

/* panel */
.panel{background:var(--elev);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .tag{font-size:10px;font-family:var(--mono);color:var(--t3);font-weight:400;border:1px solid var(--bd);padding:2px 7px;border-radius:20px}
.empty{color:var(--t3);font-size:13px;padding:18px 0;text-align:center}

table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
th{text-align:left;padding:8px 10px;color:var(--t3);font-weight:500;font-size:11px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--t2);white-space:nowrap}
tr:hover td{background:var(--hover)}
.num{color:var(--t1);font-weight:600}
.pos{color:var(--accent)} .neg{color:var(--error)}
.scroll{overflow-x:auto}

/* grid bar */
.gbar{position:relative;height:34px;background:var(--surface);border:1px solid var(--bd);border-radius:6px;margin:6px 0}
.gbar .lvl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.12)}
.gbar .lvl.hold{background:rgba(0,208,132,.45)}
.gbar .lvl.pend{background:rgba(255,255,255,.18)}
.gbar .px{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);box-shadow:0 0 8px rgba(245,158,11,.7)}
.gbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);font-family:var(--mono)}
/* 价格轴：成本线 / 现价线 / 买卖档 / 盈亏实心填充 */
.gbar2{position:relative;height:34px;background:var(--surface);border:1px solid var(--bd);
  border-radius:6px;margin:26px 0 24px}
.gbar2 .fill{position:absolute;top:0;bottom:0}
.gbar2 .fill.g{background:linear-gradient(90deg,rgba(0,208,132,.30),rgba(0,208,132,.62));
  border-left:1px solid rgba(0,208,132,.8);border-right:1px solid rgba(0,208,132,.8)}
.gbar2 .fill.r{background:linear-gradient(90deg,rgba(255,71,87,.62),rgba(255,71,87,.30));
  border-left:1px solid rgba(255,71,87,.8);border-right:1px solid rgba(255,71,87,.8)}
.gbar2 .lvlz{position:absolute;top:6px;bottom:6px;width:2px}
.gbar2 .lvlz.buy{background:rgba(0,208,132,.85)}
.gbar2 .lvlz.sell{background:rgba(255,71,87,.85)}
.gbar2 .lvlz span{position:absolute;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:9px;white-space:nowrap;padding:1px 5px;border-radius:3px;
  line-height:1.4;z-index:4}
.gbar2 .lvlz.sell span{left:5px;background:rgba(255,71,87,.22);
  border:1px solid rgba(255,71,87,.45);color:#ff8b96}
.gbar2 .lvlz.buy span{right:5px;background:rgba(0,208,132,.22);
  border:1px solid rgba(0,208,132,.45);color:#6ee7b7}
/* 贴近边缘时把标注翻到另一侧，避免被容器裁切 */
.gbar2 .lvlz.sell.flip span{left:auto;right:5px}
.gbar2 .lvlz.buy.flip span{right:auto;left:5px}
.gbar2 .mark{position:absolute;top:-3px;bottom:-3px;width:2px;z-index:3}
.gbar2 .mark.cost{background:#60a5fa;box-shadow:0 0 6px rgba(96,165,250,.9)}
.gbar2 .mark.price{background:var(--warn);box-shadow:0 0 9px rgba(245,158,11,1)}
.gbar2 .mark span{position:absolute;transform:translateX(-50%);font-family:var(--mono);
  font-size:10px;white-space:nowrap;padding:1px 6px;border-radius:4px;line-height:1.5}
.gbar2 .mark.cost span{top:-20px;background:rgba(96,165,250,.18);border:1px solid rgba(96,165,250,.45);color:#60a5fa}
.gbar2 .mark.price span{bottom:-20px;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.5);color:var(--warn)}
.gbar2 .edge{position:absolute;bottom:-17px;transform:translateX(-50%);font-family:var(--mono);
  font-size:9px;color:var(--t3);opacity:.7}
/* 成交汇总栏 */
.ord-sum{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  background:var(--surface);border:1px solid var(--bd);border-radius:8px;
  padding:10px 14px;margin-bottom:12px}
.ord-sum span{color:var(--t3)}
.ord-sum b{color:var(--t1);font-weight:600}
.ord-sum b.pos2{color:var(--accent)}
.ord-sum b.neg2{color:var(--error)}

/* 网格卡片：盈利=绿 / 亏损=红 / 空仓=灰 */
.gcard{background:var(--surface);border:1px solid var(--bd);border-left:3px solid var(--t3);
  border-radius:10px;padding:12px 14px;margin-bottom:12px;transition:.2s}
.gcard.profit{border-left-color:var(--accent);background:linear-gradient(90deg,rgba(0,208,132,.07),rgba(0,208,132,.01) 45%,transparent)}
.gcard.lose{border-left-color:var(--error);background:linear-gradient(90deg,rgba(255,71,87,.08),rgba(255,71,87,.01) 45%,transparent)}
.gcard.empty{opacity:.5;border-left-style:dashed}
.gc-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.gc-sym{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--t1)}
.gc-state{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd2);color:var(--t3)}
.gc-state.hold{border-color:rgba(0,208,132,.4);color:var(--accent);background:rgba(0,208,132,.08)}
.gc-state.drain{border-color:rgba(245,158,11,.4);color:var(--warn);background:rgba(245,158,11,.08)}
.gc-pnl{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:-.02em}
.gc-meta{font-family:var(--mono);font-size:11px;color:var(--t3);line-height:1.8;margin-bottom:4px}
.gc-row{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;margin:6px 0}
.gc-row b{font-weight:600}
.gc-ord{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;margin-top:7px}
.gc-ord span{padding:2px 9px;border-radius:5px;border:1px solid var(--bd);color:var(--t3)}
.gc-ord .b{border-color:rgba(0,208,132,.3);color:var(--accent);background:rgba(0,208,132,.05)}
.gc-ord .sl{border-color:rgba(255,71,87,.3);color:var(--error);background:rgba(255,71,87,.05)}
.gc-liq{margin-top:9px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.03);
  border:1px solid var(--bd);font-family:var(--mono);font-size:11px;color:var(--t3)}
.gc-liq.danger{background:rgba(255,71,87,.12);border-color:rgba(255,71,87,.4);color:var(--error);font-weight:600}
.gc-liq.warn{border-color:rgba(245,158,11,.35);color:var(--warn)}

/* config */
.lock{display:flex;flex-direction:column;gap:10px;align-items:center;padding:22px 0;text-align:center}
.lock input{background:var(--bg);border:1px solid var(--bd2);color:var(--t1);font-size:15px;
  padding:10px 14px;border-radius:8px;width:220px;text-align:center;outline:none;font-family:var(--mono)}
.lock input:focus{border-color:var(--accent)}
.lock .err{color:var(--error);font-size:12px;min-height:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.f label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px}
.f input,.f select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--t1);
  font-size:13px;padding:8px 10px;border-radius:8px;outline:none;font-family:var(--mono)}
.f input:focus,.f select:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--t3);line-height:1.7;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--bd2);
  border-radius:10px;padding:11px 16px;font-size:13px;opacity:0;transform:translateY(8px);
  transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><div class="dot">E</div>EvoClaw<span class="ver">v2.0</span></div>
    <div class="badges">
      <span class="badge" id="bMode">模式 —</span>
      <span class="badge" id="bDry">—</span>
      <span class="badge" id="bRun">—</span>
      <button class="btn" id="btnPause" onclick="togglePause()">暂停</button>
    </div>
  </header>

  <div class="grid-stats">
    <div class="card"><div class="lbl">合约余额 (USDT)</div><div class="val" id="sFut">—</div><div class="sub" id="sFutFree">可用 —</div></div>
    <div class="card"><div class="lbl">现货余额 (USDT)</div><div class="val" id="sSpot">—</div><div class="sub" id="sSpotFree">可用 —</div></div>
    <div class="card"><div class="lbl">运行时长</div><div class="val" id="sUp">—</div><div class="sub" id="sTick">tick —</div></div>
    <div class="card"><div class="lbl">最近状态</div><div class="val" id="sHealth" style="font-size:14px">—</div><div class="sub" id="sErr"></div></div>
  </div>

  <!-- 网格 -->
  <div class="panel" id="panelGrid" style="display:none">
    <h2>方案B · 低杠杆网格 <span class="tag" id="gridTag"></span></h2>
    <div id="gridBody"><div class="empty">暂无网格数据</div></div>
  </div>

  <!-- 定投 -->
  <div class="panel" id="panelDca" style="display:none">
    <h2>方案C · 现货定投 <span class="tag" id="dcaTag"></span></h2>
    <div id="dcaBody"><div class="empty">暂无定投数据</div></div>
  </div>

  <!-- 成交 -->
  <div class="panel">
    <h2>成交记录 <span class="tag">含模拟单</span></h2>
    <div class="ord-sum" id="ordSummary"></div>
    <div class="scroll"><table>
      <thead><tr><th>时间</th><th>币种</th><th>方向</th><th>类型</th><th>价格</th><th>数量</th><th>名义</th><th>手续费</th><th>盈亏</th><th>盈亏率</th><th>来源</th></tr></thead>
      <tbody id="ordersBody"><tr><td colspan="11" class="empty">加载中…</td></tr></tbody>
    </table></div>
  </div>

  <!-- 配置 -->
  <div class="panel">
    <h2>交易配置</h2>
    <div id="lockBox" class="lock">
      <div style="color:var(--t2);font-size:13px">请输入网页管理密码以修改配置</div>
      <input type="password" id="pwd" placeholder="管理密码" onkeydown="if(event.key==='Enter')unlock()">
      <div class="err" id="lockErr"></div>
      <button class="btn primary" id="btnUnlock" onclick="unlock()">解锁</button>
    </div>
    <div id="cfgBox" style="display:none">
      <div class="form">
        <div class="f"><label>策略模式</label><select id="cMode">
          <option value="off">关闭（只监控不下单）</option>
          <option value="grid">方案B · 低杠杆网格</option>
          <option value="dca">方案C · 现货定投</option>
        </select></div>
        <div class="f"><label>模拟盘 (dry-run)</label><select id="cDry">
          <option value="true">开启 — 只记录不下单（安全）</option>
          <option value="false">关闭 — 真实下单</option>
        </select></div>
        <div class="f"><label>循环间隔（秒）</label><input type="number" id="cLoop" min="3" step="1"></div>
        <div class="f"><label>最小下单金额 (USDT)</label><input type="number" id="cMin" min="0" step="1"></div>
      </div>
      <div class="hint">网格参数与定投参数为 JSON，直接编辑：</div>
      <div class="f" style="margin-top:8px"><label>grid</label><textarea id="cGrid" rows="7" style="width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--t1);font-family:var(--mono);font-size:12px;padding:10px;border-radius:8px;outline:none"></textarea></div>
      <div class="f" style="margin-top:8px"><label>dca</label><textarea id="cDca" rows="6" style="width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--t1);font-family:var(--mono);font-size:12px;padding:10px;border-radius:8px;outline:none"></textarea></div>
      <div class="actions">
        <button class="btn primary" id="btnSave" onclick="saveConfig()">保存配置</button>
        <button class="btn" onclick="loadConfig()">重新读取</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let PWD = "";
let STATE = {};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v,d=4)=>{const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—';};
const nfP = (v,d=4)=>{const n=Number(v);return Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(d):'—';};
const nfR = (v,d=2)=>{const n=Number(v);return Number.isFinite(n)?(n>=0?'+':'')+(n*100).toFixed(d)+'%':'—';};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function authHeaders(){return PWD?{'X-Web-Password':PWD}:{};}
async function api(p,opt){try{const r=await fetch(p,opt);return await r.json();}catch(e){return null;}}

async function loadState(){
  const d = await api('/api/state'); if(!d) return; STATE = d;
  $('bMode').textContent = '模式 ' + ({off:'关闭',grid:'网格',dca:'定投'}[d.mode]||d.mode);
  $('bMode').className = 'badge ' + (d.mode==='off'?'':'ok');
  $('bDry').textContent = d.dry_run ? '模拟盘' : '实盘';
  $('bDry').className = 'badge ' + (d.dry_run?'warn':'err');
  const h = d.health||{};
  $('bRun').textContent = h.paused ? '已暂停' : '运行中';
  $('bRun').className = 'badge ' + (h.paused?'warn':'ok');
  $('btnPause').textContent = h.paused ? '恢复' : '暂停';
  $('btnPause').className = 'btn ' + (h.paused?'primary':'danger');
  $('sFut').textContent = nf(d.futures_balance&&d.futures_balance.balance);
  $('sFutFree').textContent = '可用 ' + nf(d.futures_balance&&d.futures_balance.available);
  $('sSpot').textContent = nf(d.spot_balance&&d.spot_balance.total);
  $('sSpotFree').textContent = '可用 ' + nf(d.spot_balance&&d.spot_balance.free);
  const up = d.uptime||0, hh=Math.floor(up/3600), mm=Math.floor(up%3600/60);
  $('sUp').textContent = hh+'h'+mm+'m';
  $('sTick').textContent = 'tick ' + (h.tick||0) + (h.last_ok_seconds_ago!=null?(' · 正常 '+(h.last_ok_seconds_ago|0)+'s 前'):'');
  $('sHealth').textContent = h.last_error ? '异常' : '正常';
  $('sHealth').className = 'val ' + (h.last_error?'neg':'pos');
  $('sErr').textContent = h.last_error||'';
  $('panelGrid').style.display = d.mode==='grid' ? '' : 'none';
  $('panelDca').style.display  = d.mode==='dca'  ? '' : 'none';
  if(d.mode==='grid') loadGrid();
  if(d.mode==='dca')  loadDca();
}

async function loadGrid(){
  const d = await api('/api/grid'); if(!d||!d.symbols) return;
  const sel = d.selection||[];
  $('gridTag').textContent = d.auto_select
    ? ('自动选币 ' + sel.length + ' 个 · 运行 ' + d.symbols.length + ' 个')
    : (d.symbols.length + ' 个标的');
  if(!d.symbols.length){
    $('gridBody').innerHTML = d.auto_select
      ? '<div class="empty">自动选币进行中…（无合格标的或资金不足）</div>'
      : '<div class="empty">未配置网格标的</div>';
    return;
  }
  let html='';
  if(d.auto_select && sel.length){
    html += '<div class="hint" style="margin:-4px 0 14px">当前选中：' +
      sel.map(s => '<span class="badge" style="margin-right:6px">'+esc(s.symbol)+
        ' · 振幅'+((s.range||0)*100).toFixed(1)+'% · '+(s.quote_volume/1e8).toFixed(1)+'亿</span>').join('') +
      '<br>掉出名单的标的会自动转入「只卖不买」，卖光后退役——不会被直接抛弃。</div>';
  }
  for(const s of d.symbols){
    const lo=s.lower, up=s.upper, px=s.price;
    const hasPos = (s.base_qty||0) > 0;
    const pnl = s.unrealized_pnl||0;
    // 有仓：盈利绿 / 亏损红；无仓：灰（空仓待机）
    const cardCls = !hasPos ? 'empty' : (pnl >= 0 ? 'profit' : 'lose');
    const stateTxt = s.status==='draining' ? '只卖不买' : (hasPos ? '持仓中' : '空仓待机');
    const stateCls = s.status==='draining' ? 'drain' : (hasPos ? 'hold' : '');
    const buys  = (s.levels||[]).filter(l=>l.side==='buy');
    const sells = (s.levels||[]).filter(l=>l.side==='sell');
    const ordHtml = (buys.length||sells.length)
      ? '<div class="gc-ord">'
        + buys.map(l=>'<span class="b">买 '+nf(l.amount,0)+' @ '+nf(l.price,6)+'</span>').join('')
        + sells.map(l=>'<span class="sl">卖 '+nf(l.amount,0)+' @ '+nf(l.price,6)+'</span>').join('')
        + '</div>' : '';
    const liqDist = Math.abs(s.liq_distance||0);
    const liqCls = s.margin_mode!=='isolated' ? 'danger' : (liqDist < 0.25 ? 'danger' : (liqDist < 0.4 ? 'warn' : ''));
    const liqHtml = s.liq_price
      ? '<div class="gc-liq '+liqCls+'">'
        + (s.margin_mode==='isolated'?'逐仓':'<b>全仓(风险!)</b>') + ' · ' + (s.leverage||'?') + 'x'
        + ' · 强平价 ' + nf(s.liq_price,6)
        + ' · 距强平 ' + ((s.liq_distance||0)*100).toFixed(1) + '%'
        + (liqDist < 0.25 ? '  ⚠ 接近强平' : '') + '</div>' : '';

    // ---- 价格轴：以「区间∪成本∪现价」为显示范围，保证三个标记都在视野内 ----
    const vals = [lo, up, px].filter(v=>v>0);
    if (hasPos && s.avg_price > 0) vals.push(s.avg_price);
    const dLo0 = Math.min(...vals), dHi0 = Math.max(...vals);
    const padD = (dHi0 - dLo0) * 0.06 || 0.001;
    const dLo = dLo0 - padD, dHi = dHi0 + padD;
    const pctOf = v => Math.max(0, Math.min(100, (v - dLo) / (dHi - dLo) * 100));
    const pxPct = pctOf(px), costPct = (hasPos && s.avg_price>0) ? pctOf(s.avg_price) : null;
    // 盈亏实心填充：成本 → 现价（盈=绿，亏=红）
    let fillHtml = '';
    if (costPct !== null) {
      const a = Math.min(pxPct, costPct), b = Math.max(pxPct, costPct);
      const isUp = px >= s.avg_price;
      fillHtml = '<div class="fill '+(isUp?'g':'r')+'" style="left:'+a.toFixed(2)+'%;width:'+Math.max(0.5,b-a).toFixed(2)+'%"></div>';
    }
    const lvlHtml = (s.levels||[]).slice().sort((a,b)=>a.price-b.price).map(l=>{
      const p = pctOf(l.price);
      const isSell = l.side === 'sell';
      // 卖单默认标注在右，>70% 翻到左侧；买单默认在左，<30% 翻到右侧
      const flip = isSell ? (p > 70) : (p < 30);
      return '<div class="lvlz '+(isSell?'sell':'buy')+(flip?' flip':'')+'" style="left:'+p.toFixed(2)+'%">'
        + '<span>'+(isSell?'卖':'买')+' '+nf(l.amount,0)+' 张 @ '+nf(l.price,6)+'</span></div>';
    }).join('');
    const costMark = costPct !== null
      ? '<div class="mark cost" style="left:'+costPct.toFixed(2)+'%"><span>成本 '+nf(s.avg_price,6)+'</span></div>' : '';
    const axisHtml = '<div class="gbar2">'
      + '<div class="edge" style="left:2%">'+nf(dLo,6)+'</div>'
      + '<div class="edge" style="left:98%">'+nf(dHi,6)+'</div>'
      + fillHtml + lvlHtml + costMark
      + '<div class="mark price" style="left:'+pxPct.toFixed(2)+'%"><span>现价 '+nf(px,6)+'</span></div>'
      + '</div>';

    html += '<div class="gcard '+cardCls+'">'
      + '<div class="gc-head">'
        + '<span class="gc-sym">'+esc(s.symbol)+'</span>'
        + '<span class="gc-state '+stateCls+'">'+stateTxt+'</span>'
        + '<span class="gc-pnl '+(hasPos ? (pnl>=0?'pos':'neg') : '')+'">'
        + (hasPos ? nfR(s.unrealized_pnl_rate) : '—') + '</span>'
      + '</div>'
      + '<div class="gc-meta">现价 '+nf(px,6)+(hasPos?(' · 均价 '+nf(s.avg_price,6)):'')+'</div>'
      + '<div class="gc-row">'
        + '<span>底仓 <b>'+nf(s.base_qty,4)+'</b> 张</span>'
        + '<span>市值 <b>'+nf(s.position_value,4)+'</b> U</span>'
        + '<span>浮盈 <b class="'+(pnl>=0?'pos':'neg')+'">'+nfP(pnl,4)+'</b> U '
        + '<span class="'+(pnl>=0?'pos':'neg')+'">('+nfR(s.unrealized_pnl_rate)+')</span></span>'
        + '<span>已实现 <b class="'+(s.realized_pnl>=0?'pos':'neg')+'">'+nfP(s.realized_pnl,4)+'</b> U '
        + '<span class="'+(s.realized_pnl>=0?'pos':'neg')+'">('+nfR(s.realized_pnl_rate)+')</span></span>'
        + '<span>成交 买'+s.buy_count+'/卖'+s.sell_count+'</span>'
      + '</div>'
      + axisHtml
      + ordHtml
      + liqHtml
      + '</div>';
  }
  $('gridBody').innerHTML = html;
}

async function loadDca(){
  const d = await api('/api/dca'); if(!d||!d.symbols) return;
  $('dcaTag').textContent = '累计投入 ' + nf(d.total_cost,2) + 'U';
  let html = '<div class="scroll"><table><thead><tr><th>币种</th><th>累计投入</th><th>持仓量</th><th>均价</th><th>现价</th><th>市值</th><th>盈亏</th><th>盈利率</th><th>次数</th></tr></thead><tbody>';
  for(const s of d.symbols){
    html += '<tr><td class="num">'+esc(s.symbol)+'</td><td>'+nf(s.total_cost,2)+'</td><td>'+nf(s.total_qty,6)
      + '</td><td>'+nf(s.avg_price,6)+'</td><td>'+nf(s.price,6)+'</td><td>'+nf(s.value,2)
      + '</td><td class="'+(s.pnl>=0?'pos':'neg')+'">'+nfP(s.pnl)+'</td><td class="'+(s.pnl_rate>=0?'pos':'neg')+'">'
      + (s.pnl_rate*100).toFixed(2)+'%</td><td>'+s.buy_count+'</td></tr>';
  }
  html += '</tbody></table></div>';
  const recs = d.records||[];
  if(recs.length){
    html += '<div class="hint" style="margin-top:14px">最近定投记录</div><div class="scroll"><table><thead><tr><th>时间</th><th>币种</th><th>价格</th><th>数量</th><th>金额</th></tr></thead><tbody>';
    for(const r of recs.slice(0,20)){
      html += '<tr><td>'+esc((r.ts||'').replace('T',' ').slice(0,19))+'</td><td>'+esc(r.symbol)+'</td><td>'+nf(r.price,6)
        + '</td><td>'+nf(r.amount,6)+'</td><td>'+nf(r.cost,2)+'</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  $('dcaBody').innerHTML = html;
}

const TYPE_CN = {grid_base:'底仓买入', grid_buy:'网格买入', grid_sell:'网格卖出', dca_buy:'定投买入', close:'平仓'};

async function loadOrders(){
  const d = await api('/api/orders?limit=80'); if(!d||!d.orders) return;
  const rows = d.orders, sm = d.summary||{};
  const sum = $('ordSummary');
  if(sum){
    const pnlCls = (sm.total_pnl||0) >= 0 ? 'pos2' : 'neg2';
    sum.innerHTML =
        '<span>总盈亏 <b class="'+pnlCls+'">'+nfP(sm.total_pnl,4)+' U</b></span>'
      + '<span>总盈亏率 <b class="'+pnlCls+'">'+nfR(sm.total_pnl_rate)+'</b></span>'
      + '<span>总手续费 <b>'+nf(sm.total_fee,4)+' U</b></span>'
      + '<span>净盈亏 <b class="'+((sm.net_pnl||0)>=0?'pos2':'neg2')+'">'+nfP(sm.net_pnl,4)+' U</b></span>'
      + '<span>买入 <b>'+(sm.buy_count||0)+'</b> 笔 · 卖出 <b>'+(sm.sell_count||0)+'</b> 笔</span>'
      + '<span>平仓胜率 <b>'+(sm.win_count||0)+'胜/'+(sm.loss_count||0)+'负 ('+((sm.win_rate||0)*100).toFixed(1)+'%)</b></span>';
  }
  if(!rows.length){ $('ordersBody').innerHTML='<tr><td colspan="11" class="empty">暂无成交</td></tr>'; return; }
  $('ordersBody').innerHTML = rows.map(o=>{
    const isSell = o.side==='sell';
    const pnl = Number(o.pnl||0);
    const pnlCell = isSell
      ? '<td class="'+(pnl>=0?'pos':'neg')+'">'+nfP(pnl,4)+'</td>'
        + '<td class="'+(pnl>=0?'pos':'neg')+'">'+nfR(o.pnl_rate)+'</td>'
      : '<td>—</td><td>—</td>';
    return '<tr>'
      + '<td>'+esc((o.ts||'').replace('T',' ').slice(5,19))+'</td>'
      + '<td class="num">'+esc(o.symbol)+'</td>'
      + '<td class="'+(isSell?'neg':'pos')+'">'+(isSell?'卖':'买')+'</td>'
      + '<td>'+(TYPE_CN[o.type]||esc(o.type))+'</td>'
      + '<td>'+nf(o.price,6)+'</td><td>'+nf(o.amount,4)+'</td><td>'+nf(o.cost,2)+'</td>'
      + '<td>'+nf(o.fee,4)+'</td>'
      + pnlCell
      + '<td>'+(o.dry_run?'<span style="color:var(--warn)">模拟</span>':'实盘')+'</td></tr>';
  }).join('');
}

async function unlock(){
  const p = $('pwd').value.trim(); if(!p) return;
  const r = await fetch('/api/auth-check',{method:'POST',headers:{'X-Web-Password':p}});
  if(r.ok){ PWD=p; $('lockBox').style.display='none'; $('cfgBox').style.display=''; $('lockErr').textContent=''; loadConfig(); }
  else { $('lockErr').textContent='密码错误'; $('pwd').value=''; }
}

async function loadConfig(){
  const c = await api('/api/config'); if(!c) return;
  $('cMode').value = c.mode||'off';
  $('cDry').value = String(c.dry_run!==false);
  $('cLoop').value = c.loop_interval||10;
  $('cMin').value = c.min_order_notional||5;
  $('cGrid').value = JSON.stringify(c.grid||{},null,2);
  $('cDca').value  = JSON.stringify(c.dca||{},null,2);
}

async function saveConfig(){
  if(!PWD){ toast('请先解锁'); return; }
  let grid,dca;
  try{ grid=JSON.parse($('cGrid').value); }catch(e){ toast('grid JSON 格式错误'); return; }
  try{ dca=JSON.parse($('cDca').value); }catch(e){ toast('dca JSON 格式错误'); return; }
  const body = {mode:$('cMode').value, dry_run:$('cDry').value==='true',
    loop_interval:parseInt($('cLoop').value)||10, min_order_notional:parseFloat($('cMin').value)||5,
    grid, dca};
  const btn=$('btnSave'); btn.disabled=true; btn.textContent='保存中…';
  const r = await fetch('/api/config',{method:'POST',
    headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(body)});
  btn.disabled=false; btn.textContent='保存配置';
  if(r.status===401){ toast('未授权，请重新解锁'); PWD=''; $('cfgBox').style.display='none'; $('lockBox').style.display=''; return; }
  const d = await r.json().catch(()=>({}));
  toast(d.status==='ok' ? '配置已保存' : ('保存失败: '+(d.message||'未知')));
  if(d.status==='ok') loadState();
}

async function togglePause(){
  if(!PWD){ toast('请先解锁配置页再操作'); return; }
  const paused = !(STATE.health&&STATE.health.paused);
  const r = await fetch('/api/pause',{method:'POST',
    headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({paused})});
  if(r.status===401){ toast('未授权，请重新解锁'); PWD=''; return; }
  const d = await r.json().catch(()=>({}));
  toast(d.status==='ok' ? (d.paused?'已暂停':'已恢复') : '操作失败');
  loadState();
}

async function refreshAll(){ await loadState(); await loadOrders(); }
refreshAll();
setInterval(()=>{ if(!document.hidden) refreshAll(); }, 8000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll(); });
</script>
